[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.20"
ksp                     = "2.0.20-1.0.24"
kotlinx-serialization   = "1.7.3"
kotlinx-coroutines      = "1.8.1"
compose-bom             = "2024.09.03"
navigation-compose      = "2.8.1"
lifecycle               = "2.8.6"
activity-compose        = "1.9.2"
core-ktx                = "1.13.1"
work                    = "2.9.1"
room                    = "2.6.1"
datastore               = "1.1.1"
ktor                    = "2.3.12"
okhttp                  = "4.12.0"
bouncycastle            = "1.78.1"
jmdns                   = "3.5.9"
onnxruntime             = "1.20.0"
timber                  = "5.0.1"
junit                   = "4.13.2"
androidx-junit          = "1.2.1"
espresso                = "3.6.1"

[libraries]
# ── Core Android ──────────────────────────────────────────────────────────────
androidx-core-ktx              = { group = "androidx.core",        name = "core-ktx",              version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-ktx",version.ref = "lifecycle" }
androidx-lifecycle-service     = { group = "androidx.lifecycle",   name = "lifecycle-service",      version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity",    name = "activity-compose",       version.ref = "activity-compose" }
androidx-work-runtime-ktx      = { group = "androidx.work",        name = "work-runtime-ktx",       version.ref = "work" }

# ── Jetpack Compose ───────────────────────────────────────────────────────────
androidx-compose-bom            = { group = "androidx.compose",     name = "compose-bom",                  version.ref = "compose-bom" }
androidx-ui                     = { group = "androidx.compose.ui",  name = "ui" }
androidx-ui-graphics            = { group = "androidx.compose.ui",  name = "ui-graphics" }
androidx-ui-tooling-preview     = { group = "androidx.compose.ui",  name = "ui-tooling-preview" }
androidx-material3              = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended= { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose     = { group = "androidx.navigation",  name = "navigation-compose",            version.ref = "navigation-compose" }
androidx-lifecycle-compose      = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }

# ── Ktor Server (embedded WebSocket + REST) ───────────────────────────────────
ktor-server-core               = { group = "io.ktor", name = "ktor-server-core",               version.ref = "ktor" }
ktor-server-netty              = { group = "io.ktor", name = "ktor-server-netty",              version.ref = "ktor" }
ktor-server-websockets         = { group = "io.ktor", name = "ktor-server-websockets",         version.ref = "ktor" }
ktor-server-content-negotiation= { group = "io.ktor", name = "ktor-server-content-negotiation",version.ref = "ktor" }
ktor-serialization-json        = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",version.ref = "ktor" }
ktor-server-auth               = { group = "io.ktor", name = "ktor-server-auth",               version.ref = "ktor" }

# ── HTTP Client (mesh node calls) ─────────────────────────────────────────────
okhttp                         = { group = "com.squareup.okhttp3", name = "okhttp",         version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ── Security / TLS ────────────────────────────────────────────────────────────
bouncycastle-pkix              = { group = "org.bouncycastle", name = "bcpkix-jdk18on",  version.ref = "bouncycastle" }
bouncycastle-provider          = { group = "org.bouncycastle", name = "bcprov-jdk18on",  version.ref = "bouncycastle" }

# ── mDNS Discovery ────────────────────────────────────────────────────────────
jmdns                          = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }

# ── ONNX Runtime ─────────────────────────────────────────────────────────────
onnxruntime-android            = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }

# ── Serialization + Coroutines ────────────────────────────────────────────────
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",  version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "kotlinx-coroutines" }

# ── Storage ───────────────────────────────────────────────────────────────────
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime          = { group = "androidx.room",      name = "room-runtime",           version.ref = "room" }
androidx-room-ktx              = { group = "androidx.room",      name = "room-ktx",               version.ref = "room" }
androidx-room-compiler         = { group = "androidx.room",      name = "room-compiler",           version.ref = "room" }

# ── Logging ───────────────────────────────────────────────────────────────────
timber                         = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# ── WireGuard (VPN tunnel) — included via local AAR in libs/ ─────────────────
# See setup.sh: downloads wireguard-android tunnel AAR from official release
# wireguard-tunnel = { group = "com.wireguard.android", name = "tunnel", version = "1.0.20230706" }

# ── Testing ───────────────────────────────────────────────────────────────────
junit                          = { group = "junit",                     name = "junit",           version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext",         name = "junit",           version.ref = "androidx-junit" }
androidx-espresso-core         = { group = "androidx.test.espresso",    name = "espresso-core",   version.ref = "espresso" }
androidx-ui-test-junit4        = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-ui-tooling            = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-ui-test-manifest      = { group = "androidx.compose.ui",       name = "ui-test-manifest" }

[plugins]
android-application   = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp",                     version.ref = "ksp" }
